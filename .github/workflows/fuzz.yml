name: Nightly fuzzing

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Fuzzing time in seconds"
        default: "1800"

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fuzz the PDF worker code path
        env:
          SECONDS_TO_RUN: ${{ inputs.seconds || '1800' }}
        run: |
          [[ "$SECONDS_TO_RUN" =~ ^[0-9]+$ ]] || { echo "::error::seconds must be a number"; exit 1; }
          tools/fuzz/run.sh "$SECONDS_TO_RUN"

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: .fuzz/artifacts/
          retention-days: 30
